[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Sin startCommand: Railway ejecuta el start command en forma exec (sin shell),
# así que `&&` llega como argumento a prisma y Nest nunca arranca.
# El CMD del Dockerfile ya usa `sh -c "npx prisma migrate deploy && node dist/src/main.js"`.
# Deja también vacío el Custom Start Command del dashboard.
healthcheckPath = "/api/salud/vida"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
