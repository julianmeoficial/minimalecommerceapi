[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# La imagen final no incluye pnpm: no uses `pnpm --filter api start` en el dashboard.
# Este comando coincide con el CMD del Dockerfile.
startCommand = "npx prisma migrate deploy && node dist/main.js"
healthcheckPath = "/api/salud/vida"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
