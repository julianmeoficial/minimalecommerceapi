[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Forma exec (sin shell): el primer token es el binario. Por eso usamos `sh -c '…&&…'`
# y no un `&&` suelto (Prisma recibía el && como argumento, migraba y Nest no arrancaba).
# El CMD del Dockerfile es equivalente. Custom Start Command del dashboard: vacío
# o exactamente esta misma línea (si pones solo `npx … && node …`, vuelve el 502).
startCommand = "sh -c 'npx prisma migrate deploy && node dist/src/main.js'"
healthcheckPath = "/api/salud/vida"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
