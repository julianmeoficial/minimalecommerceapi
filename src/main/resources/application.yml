server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: minimalecommerce-api
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_uuid_jdbc_type: CHAR
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-to-a-long-random-secret-key}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  upload-dir: ${APP_UPLOAD_DIR:./uploads}
  cors:
    origins: ${APP_CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
