# Base de la API. El dominio se reconstruye aparte (ver docs/).
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Sin entidades JPA todavía: no exigir MySQL para arrancar.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# Al reconstruir el dominio, quitar el exclude de arriba y descomentar:
# spring.datasource.url=jdbc:mysql://localhost:3306/minimalecommerce?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=${MYSQL_PASSWORD:}
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# spring.sql.init.mode=never

springdoc.packages-to-scan=com.minimalecommerce.app.controller
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

logging.level.com.minimalecommerce.app=INFO
