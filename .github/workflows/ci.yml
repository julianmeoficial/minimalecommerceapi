name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: minimalecommerce
          POSTGRES_USER: app
          POSTGRES_PASSWORD: change-me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d minimalecommerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://app:change-me@localhost:5432/minimalecommerce?schema=public
      JWT_SECRET: test-secret-key-must-be-at-least-32-chars
      REDIS_URL: redis://localhost:6379
      MEDIA_DRIVER: local
      UPLOAD_DIR: /tmp/me-uploads
      CORS_ORIGINS: http://localhost:3000
      SWAGGER_ENABLED: 'false'
      PAYMENT_PROVIDER: mock
      THROTTLE_LIMIT: 10000
      THROTTLE_AUTH_LIMIT: 1000
      TRABAJOS_PROGRAMADOS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --filter api...
      - name: Prisma generate + migrate
        working-directory: apps/api
        run: |
          pnpm exec prisma generate
          pnpm exec prisma migrate deploy
      - name: Unit tests + cobertura
        working-directory: apps/api
        run: pnpm exec jest --watchman=false --coverage
      - name: E2E fase 5
        working-directory: apps/api
        run: pnpm test:e2e
      - name: Build
        working-directory: apps/api
        run: pnpm run build
      - name: Docker image
        run: docker build -t minimalecommerce-api:ci .
